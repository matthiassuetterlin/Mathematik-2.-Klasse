<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#256e65">
  <meta name="description" content="Perlen teilen, Zehner bauen und Zahlen entdecken. Eine kleine Mathe-Werkstatt zum Anfassen.">
  <title>Zahlenwerkstatt · Spielen mit Zahlen</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23256e65'/%3E%3Cg fill='%23f7c75e'%3E%3Ccircle cx='10' cy='10' r='4'/%3E%3Ccircle cx='22' cy='10' r='4'/%3E%3Ccircle cx='10' cy='22' r='4'/%3E%3C/g%3E%3Ccircle cx='22' cy='22' r='4' fill='%23f19b78'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="#" class="brand" aria-label="Zahlenwerkstatt, Anfang"><span class="brand-dots" aria-hidden="true">⠿</span>Zahlenwerkstatt</a>
    <button id="parents" class="parent-button">Für Große</button>
  </header>
  <main>
    <nav class="shelf" aria-label="Material auswählen">
      <button data-mode="split" aria-label="Teilen"><span class="nav-material split-icon" aria-hidden="true"><i></i><i></i><b></b><i></i><i></i><i></i></span><span>Teilen</span></button>
      <button data-mode="bridge" aria-label="Zehnerbrücke" aria-current="page"><span class="nav-material frame-icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b><b></b></span><span>Zur Zehn</span></button>
      <button data-mode="bank" aria-label="Freies Bauen"><span class="nav-material rod-icon" aria-hidden="true"><i></i><i></i><b></b><b></b></span><span>Bauen</span></button>
    </nav>
    <section class="workbench" aria-label="Arbeitsmatte">
      <div class="task-header">
        <div><h1 id="prompt">Mach die Zehn voll.</h1><div id="equation" class="equation" aria-live="polite"></div></div>
        <div class="helpers"><button id="demo" class="helper" aria-label="Handlung vormachen"><span aria-hidden="true">▷</span><small>Zeig’s mir</small></button><button id="sound" class="helper icon-only" aria-label="Ton einschalten" aria-pressed="false"><span aria-hidden="true">♪</span></button></div>
      </div>
      <div id="scene-wrap"><svg id="scene" viewBox="0 0 920 500" aria-label="Perlenmaterial zum Verschieben"></svg></div>
      <div id="answer-area" aria-live="polite"></div>
      <div class="bottom-bar"><div class="history-buttons"><button id="undo" class="round-button" aria-label="Letzte Handlung rückgängig" title="Zurück">↶</button><button id="reset" class="round-button" aria-label="Aufgabe von vorn" title="Nochmal">⟳</button></div><span id="small-hint" aria-live="polite"></span><button id="next" class="next-button" hidden>Weiter <span aria-hidden="true">›</span></button></div>
    </section>

  </main>
  <dialog id="parent-dialog" aria-labelledby="parent-title"><div class="dialog-heading"><h2 id="parent-title">Für euch Große</h2><button id="close-dialog" class="round-button" aria-label="Schließen">×</button></div><div id="parent-copy"></div></dialog>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
